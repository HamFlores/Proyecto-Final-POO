<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inicio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Calculadora de Huella de Carbono</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarScroll">
                    <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Tabla de Alimentos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Calculadora</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                            <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>

        <img src="images/barn-farm-field-svgrepo-com.svg" class="img-fluid" height="100" width="100">
        <h1 class="display-1">Tabla de Alimentos</h1>

        <table id="tablaAlimentos" class="table">
            <thead>
                <tr>
                <th scope="col">Identificador</th>
                <th scope="col">Nombre del Alimento</th>
                <th scope="col">Categoría</th>
                <th scope="col">Unidad</th>
                <th scope="col">Huella de Carbono (kg CO2e)</th>
                <th scope="col">Empresa</th>
                </tr>
            </thead>
            <tbody id = "cuerpoTabla">
            </tbody>
            </table>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="JS/tablaProductos.js"></script>
    </body>
</html>
