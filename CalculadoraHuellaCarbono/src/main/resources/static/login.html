<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Calculadora de Huella de Carbono</title>
    <!-- CSS de Bootstrap 5 desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/mixins/_box-shadow.scss" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap (Opcional, para que se vea aún mejor) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #f4f7f4; /* Un gris verdoso muy sutil */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .nav-pills .nav-link.active {
            background-color: #198754; /* Verde Bootstrap Eco */
        }
        .nav-pills .nav-link {
            color: #198754;
        }
        .btn-eco {
            background-color: #198754;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-eco:hover {
            background-color: #146c43;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="text-center mb-3">
                <a href="index.html" class="text-decoration-none text-success fw-semibold">
                    <i class="bi bi-arrow-left"></i> Volver al Inicio
                </a>
            </div>

            <!-- Contenedor Principal -->
            <div class="card card-login p-4 bg-white">
                
                <!-- Logo o Icono del Proyecto -->
                <div class="text-center mb-4">
                    <i class="bi bi-tree-fill text-success" style="font-size: 3rem;"></i>
                    <h4 class="mt-2 fw-bold text-dark">EcoCalculadora</h4>
                    <p class="text-muted small">Mide y reduce tu impacto ambiental</p>
                </div>

                <!-- Selector de Pestañas (Login / Registro) -->
                <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-semibold" id="tab-login" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-semibold" id="tab-registro" data-bs-toggle="pill" data-bs-target="#pills-registro" type="button" role="tab" aria-controls="pills-registro" aria-selected="false">
                            <i class="bi bi-person-plus me-2"></i>Registrarse
                        </button>
                    </li>
                </ul>

                <!-- Contenido de las Pestañas -->
                <div class="tab-content" id="pills-tabContent">
                    
                    <!-- FORMULARIO DE INICIO DE SESIÓN -->
                    <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="tab-login">
                        <form id="form-login" onsubmit="procesarLogin(event)">
                            <div class="mb-3">
                                <label for="login-email" class="form-label text-secondary fw-medium">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="login-email" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="login-password" class="form-label text-secondary fw-medium">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-eco w-100 py-2 fw-semibold">
                                Iniciar Sesión
                            </button>
                        </form>
                    </div>

                    <!-- FORMULARIO DE REGISTRO -->
                    <div class="tab-pane fade" id="pills-registro" role="tabpanel" aria-labelledby="tab-registro">
                        <form id="form-registro" onsubmit="procesarRegistro(event)">
                            <div class="mb-3">
                                <label for="reg-nombre" class="form-label text-secondary fw-medium">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="reg-nombre" placeholder="Juan Pérez" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="reg-email" class="form-label text-secondary fw-medium">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="reg-email" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="reg-password" class="form-label text-secondary fw-medium">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="reg-password-confirm" class="form-label text-secondary fw-medium">Confirmar Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="reg-password-confirm" placeholder="Mínimo 6 caracteres" minlength="6" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-eco w-100 py-2 fw-semibold">
                                Crear Cuenta
                            </button>
                        </form>
                    </div>

                </div> <!-- Fin Tab Content -->

            </div> <!-- Fin Card -->
            
        </div>
    </div>
</div>

<!-- JS de Bootstrap para que funcionen las pestañas interactivas -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="JS/login.js"></script>
</body>
</html>
